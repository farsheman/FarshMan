name: Build FarshMan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/farsheman/app
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name="FarshMan"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.farsheman.app'
            compileSdk 35

            defaultConfig {
              applicationId 'com.farsheman.app'
              minSdk 24
              targetSdk 35
              versionCode 1
              versionName '1.0'
            }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:statusBarColor">#080706</item>
              <item name="android:navigationBarColor">#080706</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>

            <application
              android:theme="@style/AppTheme"
              android:label="فرش من"
              android:usesCleartextTraffic="false">

              <activity
                android:name=".MainActivity"
                android:screenOrientation="portrait"
                android:exported="true">

                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>

              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/farsheman/app/MainActivity.java <<'EOF'
          package com.farsheman.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;

          public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);

              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.setGravity(Gravity.CENTER);
              root.setPadding(30,30,30,30);
              root.setBackgroundColor(Color.rgb(8,7,6));

              TextView title = new TextView(this);
              title.setText("فرش من");
              title.setTextColor(Color.rgb(244,232,213));
              title.setTextSize(42);
              title.setGravity(Gravity.CENTER);

              TextView slogan = new TextView(this);
              slogan.setText(
                "فرش من فرا تر از ذهن ها می آفریند\n\n" +
                "قدم بعدی شما مهم است در انتخاب آن دقت کنید"
              );
              slogan.setTextColor(Color.rgb(220,190,140));
              slogan.setTextSize(17);
              slogan.setGravity(Gravity.CENTER);
              slogan.setPadding(0,40,0,40);

              Button start = new Button(this);
              start.setText("مشاهده فرش در محیط من");

              Button catalog = new Button(this);
              catalog.setText("کاتالوگ فرش");

              root.addView(title);
              root.addView(slogan);
              root.addView(start);
              root.addView(catalog);

              setContentView(root);
            }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farsheman-apk
          path: app/build/outputs/apk/debug/app-debug.apk

              }

              .rug:nth-child(2) .rug-art {
                background:
                  repeating-linear-gradient(
                    90deg,
                    #173b39 0 9px,
                    #a47a39 9px 18px,
                    #244e49 18px 27px
                  );
              }

              .rug:nth-child(3) .rug-art {
                background:
                  repeating-linear-gradient(
                    45deg,
                    #541d22 0 10px,
                    #c59b54 10px 20px,
                    #291218 20px 30px
                  );
              }

              .rug:nth-child(4) .rug-art {
                background:
                  repeating-linear-gradient(
                    90deg,
                    #eee1c5 0 10px,
                    #70563a 10px 20px,
                    #c5aa77 20px 30px
                  );
              }

              .rug:nth-child(5) .rug-art {
                background:
                  repeating-linear-gradient(
                    45deg,
                    #182e45 0 8px,
                    #a78a54 8px 16px,
                    #223f58 16px 24px
                  );
              }

              .rug:nth-child(6) .rug-art {
                background:
                  repeating-linear-gradient(
                    90deg,
                    #442a17 0 8px,
                    #c48a3a 8px 16px,
                    #633d20 16px 24px
                  );
              }

              .rug:nth-child(7) .rug-art {
                background:
                  repeating-linear-gradient(
                    45deg,
                    #382347 0 9px,
                    #b08a56 9px 18px,
                    #55336c 18px 27px
                  );
              }

              .rug:nth-child(8) .rug-art {
                background:
                  repeating-linear-gradient(
                    90deg,
                    #173f2c 0 8px,
                    #d1b46d 8px 16px,
                    #28543b 16px 24px
                  );
              }

              .rug:nth-child(9) .rug-art {
                background:
                  repeating-linear-gradient(
                    45deg,
                    #292929 0 8px,
                    #b19b72 8px 16px,
                    #454545 16px 24px
                  );
              }

              .rug:nth-child(10) .rug-art {
                background:
                  repeating-linear-gradient(
                    90deg,
                    #742d25 0 8px,
                    #d0a54f 8px 16px,
                    #4d1d1a 16px 24px
                  );
              }

              .rug-name {
                font-size: 13px;
                margin-top: 9px;
              }

              .viewer {
                margin-top: 14px;
                border-radius: 20px;
                overflow: hidden;
                background: #090807;
                border: 1px solid #4d3d27;
              }

              model-viewer {
                width: 100%;
                height: 390px;
                background:
                  radial-gradient(circle at center,#3a3023,#090807 72%);
              }

              #rugDetails{display:grid;grid-template-columns:1fr 1fr;gap:8px}
              #rugDetails div{background:#15110e;border:1px solid #30271e;border-radius:12px;padding:9px}
              #rugDetails b{display:block;color:#d8bf8e;margin-bottom:4px}

          <body>

          <div class="page">

            <section class="brand">
              <h1>فرش من</h1>
              <div class="line"></div>

              <div class="slogan">
                فرش من فرا تر از ذهن ها می آفریند
                <br>
                قدم بعدی شما مهم است در انتخاب آن دقت کنید
              </div>

              <div class="subtitle">
                تجربه‌ای جدید برای انتخاب فرش
              </div>
            </section>

            <section class="card">
              <h2>۱ ـ فضای خودت را انتخاب کن</h2>

              <div class="buttons">

                <label class="btn primary" for="roomInput">
                  📷 عکس اتاق
                </label>

                <button class="secondary" onclick="openCamera()">
                  🎥 دوربین
                </button>

              </div>

              <input
                id="roomInput"
                type="file"
                accept="image/*"
                capture="environment"
                onchange="showRoom(event)"
              >

              <div class="room-preview" id="roomPreview">
                <img id="roomImage">
              </div>
            </section>

            <section class="card">
              <h2>۲ ـ کد فرش</h2>

              <input
                id="code"
                class="input"
                placeholder="مثلاً FM-001"
                value="FM-001"
              >

              <div class="buttons">
                <button class="primary" onclick="findRug()">
                  نمایش فرش
                </button>

                <button class="secondary" onclick="scrollCatalog()">
                  کاتالوگ
                </button>
              </div>
            </section>

            <section class="card" id="catalogSection">

              <span class="badge">کاتالوگ نمایشی نسخه ۲</span>

              <h2>۳ ـ انتخاب فرش</h2>

              <div class="catalog">

                <div class="rug active" onclick="selectRug(1,'FM-001')">

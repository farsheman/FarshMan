name: Build FarshMan APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/farsheman/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }

          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }

          rootProject.name="FarshMan"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
            id 'com.android.application'
          }

          android {
            namespace 'com.farsheman.app'
            compileSdk 35

            defaultConfig {
              applicationId 'com.farsheman.app'
              minSdk 24
              targetSdk 35
              versionCode 3
              versionName '3.0'
            }
          }

          dependencies {
            implementation 'androidx.core:core:1.15.0'
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme"
              parent="android:style/Theme.Material.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:statusBarColor">#070605</item>
              <item name="android:navigationBarColor">#070605</item>
              <item name="android:windowActionModeOverlay">true</item>
            </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.CAMERA"/>
            <application android:theme="@style/AppTheme" android:label="فرش من"
              android:usesCleartextTraffic="false" android:hardwareAccelerated="true">
              <provider android:name="androidx.core.content.FileProvider"
                android:authorities="${applicationId}.fileprovider"
                android:exported="false" android:grantUriPermissions="true">
                <meta-data android:name="android.support.FILE_PROVIDER_PATHS"
                  android:resource="@xml/file_paths"/>
              </provider>
              <activity android:name=".MainActivity" android:screenOrientation="portrait" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF


          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
            <external-files-path name="pictures" path="Pictures/" />
          </paths>
          EOF

          cat > app/src/main/java/com/farsheman/app/MainActivity.java <<'EOF'
          package com.farsheman.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.*;
          import androidx.core.content.FileProvider;
          import java.io.File;
          import java.io.IOException;
          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;

          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> fileCallback;
            private Uri cameraUri;
            private static final int CAMERA_PERMISSION=100, FILE_CHOOSER=101;

            @Override public void onCreate(Bundle b){
              super.onCreate(b);
              if(android.os.Build.VERSION.SDK_INT>=23 && checkSelfPermission(Manifest.permission.CAMERA)!=PackageManager.PERMISSION_GRANTED)
                requestPermissions(new String[]{Manifest.permission.CAMERA},CAMERA_PERMISSION);

              webView=new WebView(this);
              WebSettings st=webView.getSettings();
              st.setJavaScriptEnabled(true); st.setDomStorageEnabled(true);
              st.setAllowFileAccess(true); st.setAllowContentAccess(true);
              st.setMediaPlaybackRequiresUserGesture(false);
              st.setBuiltInZoomControls(false); st.setDisplayZoomControls(false);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient(){
                @Override public void onPermissionRequest(final PermissionRequest r){runOnUiThread(()->r.grant(r.getResources()));}
                @Override public boolean onShowFileChooser(WebView v,ValueCallback<Uri[]> cb,FileChooserParams p){
                  if(fileCallback!=null)fileCallback.onReceiveValue(null); fileCallback=cb;
                  try{
                    Intent gallery=new Intent(Intent.ACTION_OPEN_DOCUMENT); gallery.addCategory(Intent.CATEGORY_OPENABLE); gallery.setType("image/*");
                    Intent camera=new Intent(MediaStore.ACTION_IMAGE_CAPTURE); cameraUri=createCameraUri();
                    if(cameraUri!=null){camera.putExtra(MediaStore.EXTRA_OUTPUT,cameraUri);camera.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION|Intent.FLAG_GRANT_READ_URI_PERMISSION);}
                    Intent chooser=Intent.createChooser(gallery,"انتخاب عکس اتاق");
                    if(cameraUri!=null)chooser.putExtra(Intent.EXTRA_INITIAL_INTENTS,new Intent[]{camera});
                    startActivityForResult(chooser,FILE_CHOOSER); return true;
                  }catch(Exception e){fileCallback=null;return false;}
                }
              });
              webView.loadUrl("file:///android_asset/index.html"); setContentView(webView);
            }

            private Uri createCameraUri(){
              try{
                File dir=getExternalFilesDir(Environment.DIRECTORY_PICTURES); if(dir!=null&&!dir.exists())dir.mkdirs();
                String n=new SimpleDateFormat("yyyyMMdd_HHmmss",Locale.US).format(new Date());
                File f=File.createTempFile("FARSHMAN_"+n+"_",".jpg",dir);
                return FileProvider.getUriForFile(this,getPackageName()+".fileprovider",f);
              }catch(IOException e){return null;}
            }

            @Override protected void onActivityResult(int req,int result,Intent data){
              super.onActivityResult(req,result,data); if(req!=FILE_CHOOSER)return;
              Uri[] r=null;
              if(result==RESULT_OK){Uri u=data==null?null:data.getData(); if(u!=null)r=new Uri[]{u}; else if(cameraUri!=null)r=new Uri[]{cameraUri};}
              if(fileCallback!=null){fileCallback.onReceiveValue(r);fileCallback=null;} cameraUri=null;
            }

            @Override public void onBackPressed(){if(webView!=null&&webView.canGoBack())webView.goBack();else super.onBackPressed();}
          }
          EOF


          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport"
                  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

            <title>فرش من</title>

            <script type="module"

                background: #c7a66b;
              }

              .slogan {
                color: #d9bd8a;
                font-size: 17px;
                line-height: 2;
              }

              .subtitle {
                color: #aaa09a;
                font-size: 13px;
                margin-top: 12px;
              }

              .card {
                background: rgba(25,21,17,.88);
                border: 1px solid rgba(199,166,107,.25);
                border-radius: 22px;
                padding: 18px;
                margin-top: 16px;
                box-shadow: 0 12px 35px rgba(0,0,0,.35);
              }

              .card h2 {
                font-size: 20px;
                margin: 0 0 14px;
              }

              .input {
                width: 100%;
                border: 1px solid #51432e;
                border-radius: 14px;
                background: #100e0c;
                color: #fff;
                padding: 15px;
                font-size: 16px;
                outline: none;
                text-align: right;
              }

              .buttons {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                margin-top: 12px;
              }

              button,
              label.btn {
                border: 0;
                border-radius: 15px;
                padding: 14px 10px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                text-align: center;
              }

              .primary {
                background: linear-gradient(135deg,#d2b171,#8c6a35);
                color: #160f08;
              }

              .secondary {
                background: #25201a;
                color: #e8d4ae;
                border: 1px solid #59482f;
              }

              input[type=file] {
                display: none;
              }

              .room-preview {
                display: none;
                margin-top: 14px;
                border-radius: 17px;
                overflow: hidden;
                border: 1px solid #4f402b;
              }

              .room-preview img {
                width: 100%;
                display: block;
                max-height: 330px;
                object-fit: cover;
              }

              .catalog {
                display: grid;
                grid-template-columns: repeat(2,1fr);
                gap: 10px;
              }

              .rug {
                background: #14110e;
                border: 1px solid #3c3022;
                border-radius: 16px;
                padding: 9px;
                cursor: pointer;
              }

              .rug.active {
                border-color: #d0ad6b;
                box-shadow: 0 0 0 1px #d0ad6b;
              }

              .rug-art {
                height: 105px;
                border-radius: 11px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: rgba(255,255,255,.75);
                font-weight: bold;
                background:
                  repeating-linear-gradient(
                    45deg,
                    #3a2018 0 8px,
                    #a07135 8px 16px,
                    #642c24 16px 24px,
                    #c49b51 24px 32px

                color: #f6ead7;
                font-family: Tahoma, Arial, sans-serif;
                min-height: 100vh;
              }

              .page {
                width: 100%;
                max-width: 620px;
                margin: auto;
                padding: 18px 16px 50px;
              }

              .brand {
                text-align: center;
                padding: 30px 0 20px;
              }

              .brand h1 {
                margin: 0;

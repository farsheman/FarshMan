              </div>

            </section>

            <footer>
              فرش من © 2026
              <br>
              مدل فعلی برای نمایش فنی است.
            </footer>

          </div>

          <script>
            const rugs={
              "FM-001":{n:"طرح کلاسیک",d:"کلاسیک",c:"قهوه‌ای و طلایی",z:"200×300 سانتی‌متر",f:"اکریلیک",t:"1200 شانه",h:"10 میلی‌متر",w:"متوسط",s:"کلاسیک",u:"پذیرایی و نشیمن",x:"ترکیب رنگ گرم"},
              "FM-002":{n:"طرح فیروزه‌ای",d:"مدرن",c:"فیروزه‌ای",z:"200×300 سانتی‌متر",f:"پلی‌استر",t:"1200 شانه",h:"9 میلی‌متر",w:"متوسط",s:"مدرن",u:"نشیمن",x:"رنگ سرد و آرام"},
              "FM-003":{n:"طرح لاکی",d:"سنتی",c:"لاکی و طلایی",z:"250×350 سانتی‌متر",f:"اکریلیک",t:"1500 شانه",h:"10 میلی‌متر",w:"متوسط",s:"سنتی",u:"پذیرایی",x:"کنتراست بالا"},
              "FM-004":{n:"طرح روشن",d:"مینیمال",c:"کرم و خاکی",z:"200×300 سانتی‌متر",f:"پلی‌استر",t:"1000 شانه",h:"8 میلی‌متر",w:"سبک",s:"مینیمال",u:"اتاق و نشیمن",x:"فضای روشن"},
              "FM-005":{n:"طرح سرمه‌ای",d:"هندسی",c:"سرمه‌ای",z:"200×300 سانتی‌متر",f:"اکریلیک",t:"1200 شانه",h:"10 میلی‌متر",w:"متوسط",s:"مدرن",u:"نشیمن",x:"الگوی هندسی"},
              "FM-006":{n:"طرح سنتی",d:"ایرانی",c:"قهوه‌ای و نارنجی",z:"250×350 سانتی‌متر",f:"اکریلیک",t:"1500 شانه",h:"11 میلی‌متر",w:"سنگین",s:"سنتی",u:"پذیرایی",x:"رنگ گرم"},
              "FM-007":{n:"طرح ارغوانی",d:"تزئینی",c:"ارغوانی",z:"200×300 سانتی‌متر",f:"پلی‌استر",t:"1200 شانه",h:"9 میلی‌متر",w:"متوسط",s:"معاصر",u:"نشیمن",x:"رنگ شاخص"},
              "FM-008":{n:"طرح سبز",d:"طبیعت‌گرا",c:"سبز و طلایی",z:"200×300 سانتی‌متر",f:"اکریلیک",t:"1200 شانه",h:"10 میلی‌متر",w:"متوسط",s:"معاصر",u:"نشیمن",x:"حس طبیعی"},
              "FM-009":{n:"طرح مدرن",d:"هندسی",c:"طوسی و کرم",z:"200×300 سانتی‌متر",f:"پلی‌استر",t:"1000 شانه",h:"8 میلی‌متر",w:"سبک",s:"مدرن",u:"اتاق و دفتر",x:"ظاهر ساده"},
              "FM-010":{n:"طرح قرمز",d:"کلاسیک",c:"قرمز و طلایی",z:"250×350 سانتی‌متر",f:"اکریلیک",t:"1500 شانه",h:"11 میلی‌متر",w:"سنگین",s:"کلاسیک",u:"پذیرایی",x:"رنگ شاخص"}
            };
            const colors={"FM-001":["#3a2018","#a07135","#642c24","#c49b51"],"FM-002":["#173b39","#a47a39","#244e49","#315e59"],"FM-003":["#541d22","#c59b54","#291218","#8f3430"],"FM-004":["#eee1c5","#70563a","#c5aa77","#e5d5b7"],"FM-005":["#182e45","#a78a54","#223f58","#4e6480"],"FM-006":["#442a17","#c48a3a","#633d20","#9c5f25"],"FM-007":["#382347","#b08a56","#55336c","#7b5a92"],"FM-008":["#173f2c","#d1b46d","#28543b","#4c7b59"],"FM-009":["#292929","#b19b72","#454545","#777777"],"FM-010":["#742d25","#d0a54f","#4d1d1a","#a34635"]};
            let selected="FM-001", rotating=true, rug={x:50,y:55,scale:1,rot:0}, drag=null;

            function renderRug(){
              const r=rugs[selected], p=colors[selected];
              document.getElementById("selected").innerText=selected+" — "+r.n;
              document.getElementById("rugDetails").innerHTML=[["نام",r.n],["کد",selected],["طرح",r.d],["رنگ",r.c],["ابعاد",r.z],["جنس/الیاف",r.f],["تراکم",r.t],["ضخامت",r.h],["وزن",r.w],["سبک",r.s],["محل مناسب",r.u],["ویژگی خاص",r.x]].map(a=>"<div><b>"+a[0]+"</b>"+a[1]+"</div>").join("");
              document.getElementById("code").value=selected;
              const o=document.getElementById("rugOverlay");
              o.style.background="repeating-linear-gradient(45deg,"+p[0]+" 0 8px,"+p[1]+" 8px 16px,"+p[2]+" 16px 24px,"+p[3]+" 24px 32px)";
              document.querySelectorAll(".rug").forEach(e=>e.classList.toggle("active",e.innerText.indexOf(selected)>=0));
              applyRug();
            }
            function selectRug(code){if(!rugs[code])return;selected=code;renderRug();document.querySelector(".viewer").scrollIntoView({behavior:"smooth"})}
            function findRug(){const c=document.getElementById("code").value.trim().toUpperCase();if(rugs[c])selectRug(c);else alert("کد فرش پیدا نشد. کدهای موجود FM-001 تا FM-010 هستند.")}
            function scrollCatalog(){document.getElementById("catalogSection").scrollIntoView({behavior:"smooth"})}
            function toggleRotate(){rotating=!rotating;document.getElementById("rugViewer").autoRotate=rotating}
            function resetView(){const v=document.getElementById("rugViewer");v.cameraOrbit="0deg 70deg 105%";v.fieldOfView="45deg"}
            function startAR(){const v=document.getElementById("rugViewer");if(v.canActivateAR)v.activateAR();else alert("قابلیت AR به پشتیبانی گوشی و سرویس ARCore/مرورگر بستگی دارد.")}
            function openCamera(){document.getElementById("roomInput").click()}
            function showRoom(e){const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);document.getElementById("roomImage").src=u;document.getElementById("roomCanvasImage").src=u;document.getElementById("roomPreview").style.display="block";document.getElementById("roomStage").style.display="block";document.getElementById("roomControls").style.display="grid";resetRug()}
            function applyRug(){const o=document.getElementById("rugOverlay");o.style.left=rug.x+"%";o.style.top=rug.y+"%";o.style.transform="translate(-50%,-50%) rotate("+rug.rot+"deg) scale("+rug.scale+")"}
            function moveRug(x,y){rug.x=Math.max(3,Math.min(97,rug.x+x));rug.y=Math.max(3,Math.min(97,rug.y+y));applyRug()}
            function scaleRug(f){rug.scale=Math.max(.4,Math.min(2.5,rug.scale*f));applyRug()}
            function rotateRug(d){rug.rot=(rug.rot+d)%360;applyRug()}
            function resetRug(){rug={x:50,y:55,scale:1,rot:0};applyRug()}
            const stage=document.getElementById("roomStage"), overlay=document.getElementById("rugOverlay");
            overlay.addEventListener("pointerdown",e=>{overlay.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,id:e.pointerId}});
            overlay.addEventListener("pointermove",e=>{if(!drag||drag.id!==e.pointerId)return;const r=stage.getBoundingClientRect();rug.x=Math.max(2,Math.min(98,rug.x+(e.clientX-drag.x)/r.width*100));rug.y=Math.max(2,Math.min(98,rug.y+(e.clientY-drag.y)/r.height*100));drag.x=e.clientX;drag.y=e.clientY;applyRug()});
            overlay.addEventListener("pointerup",()=>drag=null);overlay.addEventListener("pointercancel",()=>drag=null);
            renderRug();
          </script>

          </body>
          </html>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: farsheman-apk-v3
          path: app/build/outputs/apk/debug/app-debug.apk
